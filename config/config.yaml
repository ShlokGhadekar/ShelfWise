# ShelfWise configuration.
# Secrets (DB password) are NOT here - they come from environment variables / .env.
# Env vars that override this file: SUBSET, LAST_DAY, POSTGRES_* (see .env.example).

paths:
  raw_dir: data/raw            # put the three M5 CSVs here
  cache_dir: data/cache        # parquet / numpy exports for modelling (git-ignored)
  models_dir: models
  reports_dir: reports
  logs_dir: logs

files:
  sales: sales_train_evaluation.csv
  calendar: calendar.csv
  prices: sell_prices.csv

# ALL | state (CA/TX/WI) | store (CA_1 ...) | comma list. Overridden by env SUBSET.
subset: CA_1

data:
  # Last observed day ("today"). null = every day in the sales file. Overridden by env LAST_DAY.
  last_day: null
  # Rows are inserted into staging in blocks of this many days. Loading in date
  # order keeps the table physically sorted by date, which makes the BRIN index useful.
  staging_chunk_days: 28

features:
  # First target day that gets a feature row. Older days are only used as
  # look-back history. d_1100 = 2014-02-02. Must leave room for train_window_days.
  start_day: 1100
  # How far back each incremental feature build re-reads history. Must cover the
  # longest window: 28 (min lag) + 56 (longest rolling window) = 84 days, and
  # days_since_last_sale cap + 28. Checked at start-up.
  lookback_buffer_days: 180
  # "Days since last sale" is capped so incremental and full rebuilds agree exactly
  # (see sql/analytics/features_select.sql).
  dsls_cap_days: 120
  # Series processed per INSERT batch (bounds Postgres memory usage).
  series_batch_size: 2000

forecast:
  horizon: 28                  # days ahead. Feature SQL uses lags >= 28, so horizon must be <= 28.

backtest:
  n_folds: 3                   # rolling-origin folds, each tests `horizon` days
  step_days: 28                # distance between consecutive forecast origins

lgbm:
  train_window_days: 700       # rows used for training: the last N days before each origin
  max_train_rows: null         # e.g. 8000000 to subsample rows on low-RAM laptops (training only!)
  num_boost_round: 2000
  early_stopping_rounds: 50
  refit_full: true             # after early stopping, retrain on ALL training days with the best #rounds
  point_objective: tweedie     # mean forecast; tweedie handles many zeros + a long right tail
  tweedie_variance_power: 1.1
  quantiles: [0.1, 0.5, 0.9]
  params:
    learning_rate: 0.05
    num_leaves: 127
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 0.1
    max_bin: 255
    num_threads: 0             # 0 = all cores
    seed: 42
    verbose: -1

baselines:
  empirical_window_days: 56    # window for the empirical-quantile baseline

evaluation:
  shap_sample_rows: 20000
  bootstrap_reps: 2000
  bootstrap_cluster: item      # resample whole items (all their stores + folds) together
  dm_hac_lag: 7                # Newey-West lag for the Diebold-Mariano test
  aggregate_models: [ets, sarima]
  aggregate_train_days: 728

decision:
  # All costs are expressed as a fraction of the item's selling price on that day.
  # These are ASSUMPTIONS (M5 has no cost data) - see docs/methodology.md.
  gross_margin: 0.30           # unit cost = 70% of price; a lost sale loses 30% of price
  goodwill_frac: 0.00          # extra penalty per lost sale (customer annoyance); 0 = conservative
  overage_frac: 0.10           # cost of each unsold unit per day (holding/markdown/waste)
  mode: newsvendor             # newsvendor (unsold stock written off daily) | carryover (stock carried, pays overage each night)
  sensitivity_critical_ratios: [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9]

quality:
  fail_on_error: true          # stop the pipeline if an ERROR-severity check fails
  price_jump_ratio: 3.0        # week-over-week price change beyond 3x (or below 1/3) is flagged
  price_outlier_ratio: 5.0     # price more than 5x away from the item's median is flagged
  sample_rows: 10

benchmark:
  repeats: 5
